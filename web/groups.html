<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, user-scalable=no">
<script>if (window.SOLVEBUDDY_APP) document.documentElement.classList.add("app"); if (window.SOLVEBUDDY_APP?.nativeBack) document.documentElement.classList.add("nativeback"); if (window.SOLVEBUDDY_APP?.tablet || /[?&]tablet=1/.test(location.search)) document.documentElement.classList.add("tablet", innerWidth > innerHeight ? "land" : "port");</script>
<title>SolveBuddy Groups</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  /* Groups (Colin 11/6): your own word groups. Bottom bar: Groups, Words, Create game. Yellow, green, blue, purple = easiest to hardest. */
  :root { --d0: #F2D35B; --d1: #8CC66B; --d2: #7FA8E0; --d3: #B08AD9; }
  .gapp { position: absolute; inset: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto; padding-top: var(--safetop, 0px); box-sizing: border-box; }
  .gview { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px 16px 20px; display: grid; gap: 10px; align-content: start; min-height: 0; }
  .gview h1 { flex: 1; min-width: 0; margin: 0; font: 800 26px/1.15 "Bricolage Grotesque", sans-serif; color: var(--ink); }
  .gview h2 { margin: 6px 0 0; font: 600 13px/1.3 Inter, sans-serif; color: var(--muted); }
  .gnote { margin: 0; font-size: 14px; color: var(--muted); }
  .gempty { margin: 0; padding: 6px 2px; font-size: 14px; color: var(--muted); }
  .ghead { display: flex; align-items: center; gap: 8px; }
  .gib { width: 40px; height: 40px; flex: none; display: grid; place-items: center; padding: 0; border: 0; border-radius: 10px; background: rgba(42,33,27,0.07); color: var(--ink); }
  .gib.on { background: var(--ink); color: #fff; }
  .glist { display: grid; gap: 8px; }
  .grow { display: grid; grid-template-columns: 8px minmax(0, 1fr); gap: 10px; width: 100%; box-sizing: border-box; padding: 10px 12px 10px 10px; border: 0; border-radius: 12px; background: var(--board); text-align: left; color: var(--ink); font: inherit; }
  .gdot { border-radius: 4px; align-self: stretch; min-height: 34px; }
  .grow b { display: block; font-size: 15px; font-weight: 700; } .grow small { display: block; font-size: 13px; color: var(--body); overflow-wrap: anywhere; }
  .gmark { padding: 0 4px; border-radius: 4px; font-weight: 800; color: var(--ink); }
  .grm { display: block; margin-top: 6px; padding: 0; border: 0; background: none; font: 600 13px Inter, sans-serif; color: var(--muted); }
  .gbtn { min-height: 46px; width: 100%; border: 0; border-radius: 12px; background: rgba(42,33,27,0.07); font: 600 15px Inter, sans-serif; color: var(--ink); }
  .gbtn.go { background: var(--ink); color: #fff; }
  .gbtn:disabled { opacity: .45; }
  .gbtn.bad { background: none; color: var(--conflict-star); }
  .gback { align-self: start; justify-self: start; }
  .gview label { display: grid; gap: 4px; font: 600 13px Inter, sans-serif; color: var(--muted); }
  .gview input { width: 100%; min-height: 44px; box-sizing: border-box; padding: 0 12px; border: 0; border-radius: 10px; background: var(--board); font: 500 16px Inter, sans-serif; color: var(--ink); -webkit-user-select: text; user-select: text; }
  .gview input.big { min-height: 52px; font: 800 24px "Bricolage Grotesque", sans-serif; }
  .gcolors { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .gc { height: 40px; padding: 0; border: 0; border-radius: 10px; font: 700 12px Inter, sans-serif; color: var(--ink); }
  .gc.on { box-shadow: inset 0 0 0 3px var(--ink); }
  .gw { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; align-items: center; }
  .gmore { min-height: 44px; padding: 0 8px; border: 0; background: none; font: 600 13px Inter, sans-serif; color: var(--muted); }
  .gchips { display: flex; flex-wrap: wrap; gap: 6px; }
  .gchip { padding: 7px 11px; border: 0; border-radius: 999px; background: rgba(42,33,27,0.07); font: 600 13px Inter, sans-serif; color: var(--ink); }
  .gchip.on { box-shadow: inset 0 0 0 2px var(--ink); }
  .gpick { grid-template-columns: 8px minmax(0, 1fr) auto; }
  .gpick:disabled { opacity: .45; }
  .gtick { align-self: center; font-weight: 800; }
  .gtiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .gt { aspect-ratio: 1.02; padding: 2px; border: 0; border-radius: 10px; background: var(--board); font: 700 13px/1.1 Inter, sans-serif; color: var(--ink); overflow-wrap: anywhere; transition: transform .12s ease, background .12s ease; }
  .gt.on { background: var(--ink); color: #fff; transform: scale(.96); }
  .gt.bump { animation: gwig .35s ease; }
  .gt.go { animation: gpop .4s var(--d, 0s) cubic-bezier(.3,1.5,.5,1) both; }
  @keyframes gwig { 25%, 75% { transform: translateX(-4px); } 50% { transform: translateX(4px); } }
  @keyframes gpop { 40% { transform: translateY(-10px) scale(1.08); } }
  .gsolved { padding: 10px; border-radius: 10px; text-align: center; font-size: 14px; font-weight: 700; color: #2A211B; animation: sbCell .35s cubic-bezier(.3,1.3,.5,1) both; }
  .gsolved small { display: block; font-size: 13px; font-weight: 500; }
  .gsay { min-height: 20px; margin: 0; text-align: center; font-size: 14px; font-weight: 600; color: var(--body); }
  .gbar { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding-bottom: 18px; border-top: 1px solid rgba(42,33,27,0.1); }
  .gbar button { padding: 12px 4px; border: 0; background: none; font: 600 14px Inter, sans-serif; color: var(--muted); }
  .gbar button.on { font-weight: 700; color: var(--ink); }
  @media (prefers-reduced-motion: reduce) { .gt.bump, .gt.go, .gsolved { animation: none; } }
</style>
</head>
<body>
<div class="phone">
  <div class="gapp"><div class="gview" id="view"></div><nav class="gbar" id="bar" aria-label="Groups sections"></nav></div>
</div>
<script type="module" src="groups.js"></script>
</body>
</html>

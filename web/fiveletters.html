<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, user-scalable=no">
<script>if (window.SOLVEBUDDY_APP) document.documentElement.classList.add("app"); if (window.SOLVEBUDDY_APP?.nativeBack) document.documentElement.classList.add("nativeback"); if (window.SOLVEBUDDY_APP?.tablet || /[?&]tablet=1/.test(location.search)) document.documentElement.classList.add("tablet", innerWidth > innerHeight ? "land" : "port");</script>
<title>SolveBuddy Five Letters</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  /* Five Letters (Colin 11/6): green = right spot, orange = in the word, grey = not in it. Letters pop in as you type, flip
     one at a time on a guess, bounce in a wave on a win, and the row shakes if it isn't a word. */
  * { -webkit-user-select: none; user-select: none; }
  .fl-right { --on: #2E9E5B; } .fl-near { --on: #E8A33D; } .fl-miss { --on: #8A7E74; }
  .screen { gap: 12px; }
  .zview { margin: auto 0; align-self: center; width: 354px; }
  .fgrid { display: grid; grid-template-columns: repeat(5, 62px); gap: 6px; justify-content: center; }
  .ft { height: 62px; display: grid; place-items: center; box-sizing: border-box; border: 2px solid var(--line); border-radius: 12px; background: var(--board);
    font: 700 28px Inter, sans-serif; color: var(--ink); }
  .ft.full { border-color: #B9AEA3; animation: flIn .14s ease-out; }
  .ft.ghost { color: #B9AEA3; }
  .ft.r, .ft.n, .ft.m { background: var(--on); border-color: var(--on); color: #fff; }
  .ft.r { --on: #2E9E5B; } .ft.n { --on: #E8A33D; color: #2A211B; } .ft.m { --on: #8A7E74; }
  .ft.flip { animation: flFlip .52s var(--d) ease-in-out both; }
  .ft.win { animation: flWin .62s var(--d) cubic-bezier(.3,1.6,.5,1) both; }
  .row-bad { animation: flShake .4s ease; }
  @keyframes flIn { from { transform: scale(1.14); } }
  @keyframes flFlip { 0%, 49% { background: var(--board); border-color: #B9AEA3; color: var(--ink); } 0% { transform: none; } 25% { transform: translateY(-8px) scale(1.1) rotateX(45deg); }
    50% { transform: translateY(-8px) scale(1.1) rotateX(90deg); } 100% { transform: none; } }
  @keyframes flWin { 0%, 100% { transform: none; } 40% { transform: translateY(-18px) rotate(-5deg); } 70% { transform: translateY(5px) rotate(2deg); } }
  @keyframes flShake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  @media (prefers-reduced-motion: reduce) { .ft.flip, .ft.win, .row-bad, .ft.full { animation-duration: .01s; } }
  .fsay { min-height: 22px; text-align: center; font-size: 14px; font-weight: 600; color: var(--body); }
  .pad { display: grid; gap: 6px; }
  .kr { display: flex; gap: 4px; justify-content: center; }
  .k { flex: 1 1 0; min-width: 0; height: 50px; padding: 0; border: 0; border-radius: 8px; background: #E6E1DA; font: 600 16px Inter, sans-serif; color: var(--ink); -webkit-tap-highlight-color: transparent; }
  .k.wide { flex: 1.6 1 0; font-size: 12px; }
  .k:active { transform: scale(.94); }
  .k.r, .k.n, .k.m { color: #fff; } .k.r { background: #2E9E5B; } .k.n { background: #E8A33D; color: #2A211B; } .k.m { background: #8A7E74; }
  /* iPad: six rows are taller than the board's square, so the grid scales to the height and stays centred in its column. */
  html.tablet { --fz: calc(var(--bz, 1) * 0.88); }
  html.tablet .phone[data-tablet] .zview { zoom: 1; transform: translateX(calc(354px * var(--bz, 1) * 0.06)) scale(var(--fz)); transform-origin: 0 0; }
  html.tablet.land .phone[data-tablet] .screen > .zview, html.tablet.port .phone[data-tablet] .screen > .zview { margin-right: calc(354px * (var(--bz, 1) - 1)); margin-bottom: calc(402px * (var(--fz) - 1)); }
  html.tablet .k { height: 62px; font-size: 19px; } html.tablet .k.wide { font-size: 14px; }
  /* All words (Colin 11/10): a tall sheet with a summary and every number. */
  .dock { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .pad[hidden], .dock[hidden], .viewbar[hidden] { display: none; }
  .viewbar { margin-top: auto; display: grid; gap: 10px; }
  .viewbar .ghost { min-height: 50px; }
  #words .sheet { max-height: 88%; padding-bottom: 0; }
  .wsum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .wsum div { background: rgba(255,255,255,.6); border-radius: 14px; padding: 10px; text-align: center; }
  .wsum b { display: block; font: 800 22px 'Bricolage Grotesque', sans-serif; font-variant-numeric: tabular-nums; }
  .wsum span { font-size: 12px; color: var(--muted); }
  .wlist { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; overflow-y: auto; padding: 2px 2px 24px; min-height: 0; }
  .w { height: 58px; border-radius: 12px; background: var(--board); border: 1.5px solid var(--line); display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 1px; padding: 0; font-family: Inter, sans-serif; color: var(--ink); }
  .w b { font-size: 15px; font-variant-numeric: tabular-nums; } .w small { font-size: 10px; font-weight: 700; letter-spacing: .02em; }
  .w.won { background: #E3F3E9; border-color: #BFE3CC; } .w.won small { color: #2E9E5B; }
  .w.lost { background: #EEEAE6; } .w.lost small { color: #8A7E74; }
  .w.now { border: 2.5px solid var(--brand); } .w.now small { color: var(--brand-dark); }
</style>
</head>
<body>
<div class="phone" data-tablet="split" style="--base:354">
  <div class="screen">
    <header><button class="sq glass" id="backBtn" aria-label="Back to library"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
      <div class="title"><b>Five Letters</b><span id="sub"></span></div><span class="sq" aria-hidden="true" style="visibility:hidden"></span></header>
    <div class="info"><span class="fsay" id="say" style="flex:1"></span></div>
    <div class="zview" id="zview"><div class="fgrid" id="grid"></div></div>
    <div class="pad" id="pad"></div>
    <div class="viewbar" id="viewBar" hidden><button class="dark" id="againBtn">Play it again</button><button class="ghost" id="allBtn">Back to all words</button></div>
    <div class="dock" id="dock">
      <button class="tool glass hint-tool" id="hintBtn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg><span>Hint</span></button>
      <button class="tool glass" id="newBtn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg><span>Next word</span></button>
      <button class="tool glass" id="wordsBtn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h6v6H4z M14 4h6v6h-6z M4 14h6v6H4z M14 14h6v6h-6z"/></svg><span>All words</span></button>
    </div>
  </div>
  <section class="hint" id="hint" hidden aria-label="Hint">
    <div class="hint-top"><div><span style="font-weight:700" id="hintStep"></span></div></div>
    <button class="x" id="hintClose" aria-label="Close hint"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2A211B" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <p class="h1" id="hintTitle"></p>
    <p class="h2" id="hintBody"></p>
    <button class="dark" id="hintNext"><span id="hintNextLabel"></span></button>
  </section>
  <div class="scrim" id="words" hidden>
    <section class="sheet" role="dialog" aria-label="All words">
      <div class="sheet-top"><h2>All words</h2><button class="sq" style="background:rgba(255,255,255,.6); border:1px solid rgba(255,255,255,.9)" id="wordsClose" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2A211B" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12 M18 6L6 18"/></svg></button></div>
      <div class="wsum" id="wordsSum"></div>
      <div class="wlist" id="wordsList"></div>
    </section>
  </div>
</div>
<script type="module" src="fiveletters.js"></script>
</body>
</html>

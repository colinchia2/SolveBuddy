<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, user-scalable=no">
<script>if (window.SOLVEBUDDY_APP) document.documentElement.classList.add("app")</script>
<title>SolveBuddy Import</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="screens.css">
<style>
  /* Import tab (approved mockups, canvas row "Import a puzzle", Colin 10/22). */
  .bring { padding: 18px; border-radius: 18px; display: flex; flex-direction: column; gap: 12px; background: rgba(255,255,255,0.55);
    border: 1px solid rgba(255,255,255,0.9); box-shadow: 0 8px 22px rgba(30,30,30,0.07), inset 0 1px 0 #fff; }
  .bring .line b { font-size: 17px; font-weight: 700; }
  .cam { width: 52px; height: 52px; flex: none; border-radius: 12px; background: var(--brand-soft); display: grid; place-items: center; }
  .primary { min-height: 52px; border-radius: 14px; border: none; background: var(--brand); color: #fff; font: 700 15px Inter, sans-serif;
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
  .primary[disabled] { background: rgba(42,33,27,0.12); color: var(--muted); }
  .plain { min-height: 52px; border-radius: 14px; border: 1px solid rgba(42,33,27,0.18); background: #fff; color: var(--ink); font: 600 15px Inter, sans-serif; width: 100%; }
  .row-head { display: flex; align-items: center; justify-content: space-between; }
  .sort { display: flex; align-items: center; gap: 4px; min-height: 36px; padding: 0 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.9);
    background: rgba(255,255,255,0.6); font: 600 13px Inter, sans-serif; color: var(--ink); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .fchip { min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid rgba(42,33,27,0.14); background: rgba(255,255,255,0.6);
    color: var(--ink); font: 600 13px Inter, sans-serif; }
  .fchip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: #fff; }
  .day { display: flex; flex-direction: column; gap: 8px; }
  .day > span { font-size: 13px; font-weight: 700; color: var(--body); }
  .imp { display: flex; align-items: center; gap: 12px; padding: 10px 6px 10px 12px; border-radius: 14px; background: rgba(255,255,255,0.5);
    border: 1px solid rgba(255,255,255,0.9); box-shadow: 0 4px 12px rgba(30,30,30,0.05); animation: sbTileIn 0.35s calc(0.05s + var(--i) * 0.05s) cubic-bezier(0.3,1.3,0.5,1) both; }
  .imp-open { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 0; border: none; background: none; text-align: left; color: var(--ink); }
  .imp-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .imp-text b { font-size: 15px; }
  .imp-text small { font-size: 12px; color: var(--muted); }
  .state { flex: none; font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 999px; background: rgba(42,33,27,0.07); color: var(--body); }
  .state.progress { background: #FFF1D6; color: #7A4E00; }
  .state.solved { background: var(--brand-soft); color: var(--brand-dark); }
  .more { width: 36px; height: 44px; flex: none; border: none; background: none; padding: 0; display: grid; place-items: center; color: var(--muted); }
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .steps i { height: 4px; border-radius: 2px; background: rgba(42,33,27,0.12); }
  .steps i.on { background: var(--brand); }
  .types { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .type { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 6px; min-height: 104px; border-radius: 14px; color: var(--ink);
    font: 700 14px Inter, sans-serif; background: rgba(255,255,255,0.45); border: 1px solid rgba(255,255,255,0.9); }
  .type[aria-pressed="true"] { background: #fff; border: 2px solid var(--brand); }
  .type[disabled] { opacity: 0.55; }
  .type small { font-size: 11px; font-weight: 600; color: var(--muted); }
  .opts { padding: 16px; border-radius: 16px; display: flex; flex-direction: column; gap: 14px; background: rgba(255,255,255,0.55); border: 1px solid rgba(255,255,255,0.9); }
  .opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .opt > span { display: flex; flex-direction: column; }
  .opt small { font-size: 12px; color: var(--muted); }
  .stepper { display: flex; align-items: center; gap: 10px; }
  .stepper button { width: 44px; height: 44px; border-radius: 12px; border: 1px solid rgba(42,33,27,0.14); background: #fff; font: 600 22px Inter, sans-serif; color: var(--ink); padding: 0; }
  .stepper button[disabled] { opacity: 0.35; }
  .stepper b { font-size: 20px; min-width: 64px; text-align: center; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 4px; border-radius: 12px; background: rgba(42,33,27,0.06); }
  .seg button { min-height: 44px; border-radius: 10px; border: none; background: transparent; font: 600 14px Inter, sans-serif; color: var(--ink); }
  .seg button[aria-pressed="true"] { background: #fff; font-weight: 700; box-shadow: 0 2px 8px rgba(30,30,30,0.08); }
  .seg button[disabled] { color: rgba(42,33,27,0.3); }
  .note { padding: 16px; border-radius: 16px; display: flex; gap: 12px; align-items: flex-start; background: rgba(255,255,255,0.55); border: 1px solid rgba(255,255,255,0.9); }
  .note p { margin: 0; color: var(--body); }
  .banner { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: rgba(42,33,27,0.06); color: var(--body); min-height: 52px; }
  .banner b { font-size: 14px; display: block; }
  .banner small { font-size: 12px; display: block; }
  .banner .dot { width: 28px; height: 28px; flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #fff; background: rgba(42,33,27,0.35); }
  .banner.good { background: #DDEFD9; color: #2F6B4A; } .banner.good .dot { background: #2F6B4A; }
  .banner.bad { background: #FDE3E0; color: #8E2A1F; } .banner.bad .dot { background: #C23B2E; }
  .banner.warn { background: #FFF1D6; color: #7A4E00; } .banner.warn .dot { background: #B07A12; }
  .banner.busy .dot { animation: sbSpin 0.9s linear infinite; background: none; border: 3px solid rgba(42,33,27,0.2); border-top-color: var(--brand); width: 22px; height: 22px; }
  @keyframes sbSpin { to { transform: rotate(360deg); } }
  .eboard { align-self: center; display: grid; grid-template-columns: repeat(var(--n), var(--cell)); border: 3px solid var(--ink); border-radius: 10px;
    overflow: hidden; box-shadow: 0 12px 32px rgba(30,30,30,0.14); touch-action: none; background: #FFFDF9; }
  .ec { width: var(--cell); height: var(--cell); box-sizing: border-box; padding: 0; margin: 0; border: none; display: grid; place-items: center;
    border-right: 1px solid rgba(42,33,27,0.16); border-bottom: 1px solid rgba(42,33,27,0.16); font: 600 calc(var(--cell) * 0.45) Inter, sans-serif; color: #7A6B5F; }
  .ec.br { border-right: 3px solid var(--ink); } .ec.bb { border-bottom: 3px solid var(--ink); }
  .ec.blank { background-image: repeating-linear-gradient(135deg, rgba(42,33,27,0.06) 0 3px, transparent 3px 8px); }
  .ec.clash { box-shadow: inset 0 0 0 3px #C23B2E; }
  .ec svg { width: 62%; height: 62%; }
  /* Sudoku editor */
  .sboard { align-self: center; display: grid; grid-template-columns: repeat(9, 36px); border: 3px solid var(--ink); border-radius: 10px; overflow: hidden;
    box-shadow: 0 12px 32px rgba(30,30,30,0.14); background: #FFFDF9; }
  .sc { width: 36px; height: 36px; box-sizing: border-box; padding: 0; margin: 0; border: none; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
    background: #FFFDF9; font: 600 19px Inter, sans-serif; color: var(--pencil); }
  .sc.br { border-right: 3px solid var(--ink); } .sc.bb { border-bottom: 3px solid var(--ink); }
  .sc.given { color: var(--ink); font-weight: 700; }
  .sc.sel { background: var(--sel); }
  .sc.clash { color: var(--conflict-star); background: color-mix(in srgb, #F4A6A0 35%, #FFFDF9); }
  .sc.wrong { box-shadow: inset 0 0 0 3px #B07A12; }
  .spad { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
  .spad button { min-height: 44px; border-radius: 10px; border: 1px solid rgba(42,33,27,0.14); background: #fff; font: 600 20px Inter, sans-serif; color: var(--ink); padding: 0; }
  .spad .clr { font-size: 13px; }
  /* Water Sort editor */
  .wboard { align-self: center; display: flex; flex-direction: column; gap: 14px; }
  .wrow { display: flex; gap: 10px; justify-content: center; }
  .wtube { width: 40px; height: 100px; box-sizing: border-box; padding: 3px; margin: 0; display: flex; flex-direction: column-reverse; justify-content: flex-start; gap: 2px;
    border-radius: 8px 8px 18px 18px; background: rgba(255,255,255,0.75); border: 1.5px solid rgba(42,33,27,0.18); overflow: hidden; }
  .wtube i { display: block; height: 21px; flex: none; border-radius: 3px; }
  .wtube i:first-child { border-radius: 3px 3px 13px 13px; }
  .wtube.sel { border: 3px solid var(--brand); transform: translateY(-4px); }
  .wswatches { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
  .wsw { height: 44px; border-radius: 10px; border: 1px solid rgba(42,33,27,0.15); padding: 0; position: relative; }
  .wsw b { position: absolute; right: 3px; bottom: 2px; font: 700 11px Inter, sans-serif; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.4); }
  .tools { display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 14px; background: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.9); }
  .mode { grid-template-columns: repeat(2, 1fr); }
  .swatches { display: flex; gap: 6px; flex-wrap: wrap; }
  .sw { width: 38px; height: 38px; border-radius: 10px; padding: 0; border: 1px solid rgba(42,33,27,0.2); }
  .sw[aria-pressed="true"] { border: 3px solid var(--brand); }
  .twin { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; }
  .menu-btn { min-height: 50px; width: 100%; border-radius: 12px; font: 700 15px Inter, sans-serif; border: none; }
  .menu-btn.danger { background: #C23B2E; color: #fff; }
</style>
</head>
<body>
<div class="picker"><a href="home.html">Home</a><a href="sudoku.html">Sudoku</a><a href="starbattle.html">Star Battle</a></div>

<div class="phone">
  <div class="glow" style="top:-80px; right:-90px; background:#DCE9F2; opacity:.55"></div>
  <div class="glow" style="top:420px; left:-120px; background:#E8E4F3; opacity:.6"></div>

  <div class="page">
    <header class="brandbar">
      <button class="logo-btn" id="logoBtn" aria-label="SolveBuddy: back to Library"></button>
      <h1 class="wordmark">Import</h1>
    </header>
    <section id="view" class="gameview"></section>
  </div>

  <div class="scrim" id="menu" hidden><section class="sheet" role="dialog" aria-label="Import options"></section></div>
</div>

<script type="module" src="import.js"></script>
</body>
</html>

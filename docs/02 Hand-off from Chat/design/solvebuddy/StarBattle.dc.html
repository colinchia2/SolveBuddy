<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SolveBuddy — Star Battle</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;overflow:hidden;scrollbar-width:none}
::-webkit-scrollbar{display:none}
a{color:#C24E2A}a:hover{color:#9A3B1F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F6F4F1; color: #2A211B; font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.4">
<div aria-hidden="true" style="position: absolute; top: -90px; left: -80px; width: 280px; height: 280px; border-radius: 50%; background: #DCE9F2; opacity: 0.6; filter: blur(50px)"></div>
<div aria-hidden="true" style="position: absolute; top: 520px; right: -110px; width: 280px; height: 280px; border-radius: 50%; background: #BFE3D8; opacity: 0.6; filter: blur(50px)"></div>

<div style="position: relative; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 12px">

<header style="display: flex; align-items: center; gap: 8px">
<a href="Main.dc.html" aria-label="Back to home" style="width: 44px; height: 44px; border-radius: 12px; box-sizing: border-box; display: grid; place-items: center; color: #2A211B; background: rgba(255,255,255,0.3); -webkit-backdrop-filter: blur(18px) saturate(170%); backdrop-filter: blur(18px) saturate(170%); border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 6px 18px rgba(30,30,30,0.10), inset 0 1px 0 rgba(255,255,255,0.9)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5 M11 6l-6 6 6 6"></path></svg></a>
<div style="flex: 1; display: flex; flex-direction: column; align-items: center">
<span style="display: flex; align-items: center; gap: 6px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px; line-height: 1.1"><svg width="20" height="20" viewBox="0 0 24 24" fill="#C24E2A" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.5 1.3 6.6L12 17.3l-5.9 3.2 1.3-6.6-4.9-4.5 6.6-.8z"></path></svg>Star Battle</span>
<span style="font-size: 12px; color: #6B5D52">6×6 · Starter pack · #12</span>
</div>
<div style="display: flex; gap: 6px">
<button aria-label="How to play" style="width: 44px; height: 44px; border-radius: 12px; padding: 0; display: grid; place-items: center; background: rgba(255,255,255,0.3); -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%); border: 1px solid rgba(255,255,255,0.75); box-shadow: 0 6px 18px rgba(30,30,30,0.07), inset 0 1px 0 rgba(255,255,255,0.9)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2A211B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14 M12 17.5v.01"></path></svg></button>
<button aria-label="Undo" style="width: 44px; height: 44px; border-radius: 12px; padding: 0; display: grid; place-items: center; background: rgba(255,255,255,0.3); -webkit-backdrop-filter: blur(18px) saturate(170%); backdrop-filter: blur(18px) saturate(170%); border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 6px 18px rgba(30,30,30,0.10), inset 0 1px 0 rgba(255,255,255,0.9)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2A211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14l-5-5 5-5 M4 9h10a6 6 0 0 1 0 12h-3"></path></svg></button>
<button aria-label="Hint" aria-pressed="true" style="width: 44px; height: 44px; border-radius: 12px; padding: 0; display: grid; place-items: center; background: rgba(255,255,255,0.85); -webkit-backdrop-filter: blur(18px) saturate(170%); backdrop-filter: blur(18px) saturate(170%); border: 1.5px solid #2A211B; box-shadow: 0 6px 18px rgba(30,30,30,0.10), inset 0 1px 0 rgba(255,255,255,0.9)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C24E2A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6 M10 21h4 M12 3a6 6 0 0 0-3.5 10.9c.6.4 1 1.1 1 1.8V16h5v-.3c0-.7.4-1.4 1-1.8A6 6 0 0 0 12 3z"></path></svg></button>
</div>
</header>

<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
<span style="display: flex; align-items: center; gap: 6px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2A211B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>1:24</span>
<span style="display: flex; align-items: center; gap: 4px; font-size: 12px; color: #6B5D52"><svg width="14" height="14" viewBox="0 0 24 24" fill="#6B5D52" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.5 1.3 6.6L12 17.3l-5.9 3.2 1.3-6.6-4.9-4.5 6.6-.8z"></path></svg>1 per row, column &amp; region</span>
<button style="min-height: 36px; padding: 0 12px; border-radius: 10px; display: flex; align-items: center; gap: 6px; font: 600 13px Inter, sans-serif; color: #2A211B; background: rgba(255,255,255,0.3); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 4px 12px rgba(30,30,30,0.08), inset 0 1px 0 rgba(255,255,255,0.9)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7 M3 4v5h5"></path></svg>Restart</button>
</div>

<div style="align-self: center; display: grid; grid-template-columns: repeat(6, 56px); border-top: 3px solid #2A211B; border-left: 3px solid #2A211B; border-radius: 10px; overflow: hidden; box-shadow: 0 10px 28px rgba(30,30,30,0.14)">
<sc-for list="{{cells}}" as="cell" hint-placeholder-count="36">
<div style="{{cell.style}}">
<sc-if value="{{cell.star}}" hint-placeholder-val="{{false}}"><svg width="30" height="30" viewBox="0 0 24 24" role="img" aria-label="Star"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.5 1.3 6.6L12 17.3l-5.9 3.2 1.3-6.6-4.9-4.5 6.6-.8z" fill="#2A211B"></path></svg></sc-if>
<sc-if value="{{cell.x}}" hint-placeholder-val="{{false}}"><span style="{{cell.xStyle}}" aria-label="Crossed out">×</span></sc-if>
</div>
</sc-for>
</div>

<section aria-label="Hint" style="padding: 14px 16px; border-radius: 16px; display: flex; flex-direction: column; gap: 8px; background: rgba(255,255,255,0.42); -webkit-backdrop-filter: blur(20px) saturate(170%); backdrop-filter: blur(20px) saturate(170%); border: 1px solid rgba(255,255,255,0.85); box-shadow: 0 10px 28px rgba(30,30,30,0.14), inset 0 1px 0 rgba(255,255,255,0.95)">
<div style="display: flex; justify-content: space-between; align-items: center">
<div style="display: flex; align-items: center; gap: 8px">
<svg width="28" height="28" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="45" fill="#4D96FF"></circle><g fill="#FFFFFF" stroke="#5D4E37" stroke-width="3" stroke-linejoin="round"><path d="M33 22 A8 8 0 0 1 38 36.2 L37 41 H29 L28 36.2 A8 8 0 0 1 33 22 Z"></path><path d="M67 22 A8 8 0 0 1 72 36.2 L71 41 H63 L62 36.2 A8 8 0 0 1 67 22 Z"></path></g><path d="M29.5 45 H36.5 M30.5 49 H35.5 M63.5 45 H70.5 M64.5 49 H69.5" stroke="#5D4E37" stroke-width="3" stroke-linecap="round"></path><path d="M25 57 Q50 85 75 57" stroke="#5D4E37" stroke-width="4" fill="none" stroke-linecap="round"></path></svg>
<span style="font-weight: 700">Hint</span>
<span style="display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 8px; background: #FBE3D6; color: #A23F20"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="M3 3h18v8H3z"></path></svg>Confined region</span>
</div>
<div style="display: flex; gap: 4px" aria-label="Step {{step}} of 3">
<span style="{{dot1}}"></span><span style="{{dot2}}"></span><span style="{{dot3}}"></span>
</div>
</div>
<p style="margin: 0; font-weight: 600; font-size: 16px">{{hintTitle}}</p>
<p style="margin: 0; color: #4E433A; font-size: 14px">{{hintBody}}</p>
<sc-if value="{{notDone}}" hint-placeholder-val="{{true}}">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button onClick="{{showMe}}" style="min-height: 44px; border-radius: 12px; border: 1px solid #2A211B; background: rgba(255,255,255,0.7); font: 600 14px Inter, sans-serif; color: #2A211B; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>Show me</button>
<button onClick="{{next}}" style="min-height: 44px; border-radius: 12px; border: none; background: #2A211B; font: 600 14px Inter, sans-serif; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 6px">Next step<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14 M13 6l6 6-6 6"></path></svg></button>
</div>
</sc-if>
<sc-if value="{{done}}" hint-placeholder-val="{{false}}">
<button onClick="{{restart}}" style="min-height: 44px; border-radius: 12px; border: none; background: #2A211B; font: 600 14px Inter, sans-serif; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l4 4 10-10"></path></svg>Got it</button>
</sc-if>
</section>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const step = (this.state && this.state.step) || 1;
    const R = ['AAABBC', 'AABBCC', 'DABCCC', 'DDEECC', 'DEEEEE', 'DDEFFF'];
    const col = { A: '#D8C3EA', B: '#FFD08A', C: '#A6D8D0', D: '#C6E2A6', E: '#F5C2C9', F: '#FF9F6E' };
    const userX = ['0,0', '0,2', '1,0', '1,1', '1,2'];
    const thick = '3px solid #2A211B', thin = '1px solid rgba(42,33,27,0.18)';
    const cells = [];
    for (let r = 0; r < 6; r++) {
      for (let c = 0; c < 6; c++) {
        const reg = R[r][c];
        const base = reg === 'F' ? col[reg] : 'color-mix(in srgb, ' + col[reg] + ' 42%, #FFFDF9)';
        const stripe = step >= 2 && r === 5 && c < 3;
        const auto = step >= 3 && r === 5 && c < 3;
        const bg = stripe && !auto ? 'repeating-linear-gradient(135deg, rgba(194,78,42,0.38) 0 4px, rgba(255,255,255,0) 4px 10px), ' + base : base;
        const br = (c === 5 || R[r][c + 1] !== reg) ? thick : thin;
        const bb = (r === 5 || R[r + 1][c] !== reg) ? thick : thin;
        cells.push({
          style: 'width: 56px; height: 56px; box-sizing: border-box; display: grid; place-items: center; border-right: ' + br + '; border-bottom: ' + bb + '; background: ' + bg,
          star: r === 0 && c === 1,
          x: auto || userX.indexOf(r + ',' + c) >= 0,
          xStyle: 'font-size: 26px; font-weight: 600; line-height: 1; color: ' + (auto ? '#A23F20' : '#7A6B5F')
        });
      }
    }
    const texts = {
      1: ['Look at the orange region.', 'Something about its shape decides a whole row. Can you spot it?'],
      2: ['Orange lives entirely in the bottom row.', 'So orange’s star must be in the bottom row — no other cell in that row can hold one. Eliminate the striped cells.'],
      3: ['Crossed out!', 'Those three cells can never hold a star. Whenever a region fits inside one row or column, it claims that line.']
    };
    const dot = (on) => 'width: 18px; height: 6px; border-radius: 3px; background: ' + (on ? '#C24E2A' : '#E6D8C9');
    return {
      cells, step,
      hintTitle: texts[step][0], hintBody: texts[step][1],
      dot1: dot(step >= 1), dot2: dot(step >= 2), dot3: dot(step >= 3),
      notDone: step < 3, done: step === 3,
      next: () => this.setState({ step: Math.min(3, step + 1) }),
      showMe: () => this.setState({ step: 3 }),
      restart: () => this.setState({ step: 1 })
    };
  }
}
</script>
</body>
</html>

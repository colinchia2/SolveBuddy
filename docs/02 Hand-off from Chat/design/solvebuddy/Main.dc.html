<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SolveBuddy — Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;overflow:hidden;scrollbar-width:none}
::-webkit-scrollbar{display:none}
a{color:#C24E2A}a:hover{color:#9A3B1F}
@keyframes sbFade{from{opacity:0}to{opacity:1}}
@keyframes sbPop{0%{opacity:0;transform:scale(0.35)}60%{opacity:1;transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}
@keyframes sbRise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F6F4F1; color: #2A211B; font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.4">
<div aria-hidden="true" style="position: absolute; top: -80px; right: -90px; width: 280px; height: 280px; border-radius: 50%; background: #DCE9F2; opacity: 0.55; filter: blur(50px)"></div>
<div aria-hidden="true" style="position: absolute; top: 380px; left: -120px; width: 260px; height: 260px; border-radius: 50%; background: #BFE3D8; opacity: 0.6; filter: blur(50px)"></div>
<div aria-hidden="true" style="position: absolute; bottom: -60px; right: -60px; width: 240px; height: 240px; border-radius: 50%; background: #E8E4F3; opacity: 0.5; filter: blur(50px)"></div>

<div style="position: relative; height: 844px; box-sizing: border-box; padding: 24px 16px 104px; display: flex; flex-direction: column; gap: 16px">

<header style="display: flex; justify-content: space-between; align-items: center">
<div style="display: flex; align-items: center; gap: 10px">
<svg width="40" height="40" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="45" fill="#4D96FF"></circle><g fill="#FFFFFF" stroke="#5D4E37" stroke-width="3" stroke-linejoin="round"><path d="M33 22 A8 8 0 0 1 38 36.2 L37 41 H29 L28 36.2 A8 8 0 0 1 33 22 Z"></path><path d="M67 22 A8 8 0 0 1 72 36.2 L71 41 H63 L62 36.2 A8 8 0 0 1 67 22 Z"></path></g><path d="M29.5 45 H36.5 M30.5 49 H35.5 M63.5 45 H70.5 M64.5 49 H69.5" stroke="#5D4E37" stroke-width="3" stroke-linecap="round"></path><path d="M25 57 Q50 85 75 57" stroke="#5D4E37" stroke-width="4" fill="none" stroke-linecap="round"></path></svg>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px; letter-spacing: -0.01em">SolveBuddy</span>
</div>
<div style="display: flex; align-items: center; gap: 8px">
<span style="display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 10px; background: rgba(255,255,255,0.3); -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%); border: 1px solid rgba(255,255,255,0.75); box-shadow: 0 6px 18px rgba(30,30,30,0.07), inset 0 1px 0 rgba(255,255,255,0.9)"><svg width="16" height="16" viewBox="0 0 24 24" fill="#E8743F" aria-hidden="true"><path d="M12 2c1.2 3.4 5 5.2 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5.2 1.6 1 2.6 2 3 0-3.5.3-6 1-8.5z"></path></svg>5 days</span>
<a href="Settings.dc.html" aria-label="Profile and settings" style="box-sizing: border-box; color: #2A211B; width: 44px; height: 44px; border-radius: 12px; padding: 0; display: grid; place-items: center; background: rgba(255,255,255,0.3); -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%); border: 1px solid rgba(255,255,255,0.75); box-shadow: 0 6px 18px rgba(30,30,30,0.07), inset 0 1px 0 rgba(255,255,255,0.9)"><span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 50%; background: #FBE3D6; display: grid; place-items: center; font: 800 16px 'Bricolage Grotesque', sans-serif; color: #A23F20">C</span></a>
</div>
</header>

<section style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 12px">
<h2 style="margin: 0; text-align: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -0.01em">What are we solving?</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{games}}" as="g" hint-placeholder-count="6">
<button onClick="{{g.open}}" aria-label="Open {{g.name}}" style="display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 16px; min-height: 148px; box-sizing: border-box; border-radius: 16px; text-align: left; color: #2A211B; font-family: Inter, sans-serif; background: rgba(255,255,255,0.38); -webkit-backdrop-filter: blur(16px) saturate(160%); backdrop-filter: blur(16px) saturate(160%); border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 8px 22px rgba(30,30,30,0.07), inset 0 1px 0 rgba(255,255,255,0.95)">
<span style="{{g.tile}}" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="{{g.ink}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{g.path}}"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 700; font-size: 17px">{{g.name}}</span><span style="font-size: 13px; color: #6B5D52">{{g.count}}</span></span>
</button>
</sc-for>
</div>
</section>

</div>

<nav aria-label="Tabs" style="position: absolute; left: 40px; right: 40px; bottom: 18px; height: 66px; box-sizing: border-box; padding: 6px; border-radius: 22px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: rgba(255,255,255,0.28); -webkit-backdrop-filter: blur(24px) saturate(170%); backdrop-filter: blur(24px) saturate(170%); border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 12px 32px rgba(30,30,30,0.12), inset 0 1px 0 rgba(255,255,255,0.95)">
<a href="Main.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 16px; background: rgba(255,255,255,0.7); box-shadow: inset 0 1px 0 rgba(255,255,255,1), 0 2px 8px rgba(30,30,30,0.06); text-decoration: none; color: #2A211B; font-size: 11px; font-weight: 700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h6v6H4z M14 4h6v6h-6z M4 14h6v6H4z M14 14h6v6h-6z"></path></svg>Library</a>
<a href="Packs.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 16px; text-decoration: none; color: #4E433A; font-size: 11px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8l-9-5-9 5 9 5z M3 8v8l9 5 9-5V8 M12 13v8"></path></svg>Packs</a>
<a href="Stats.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 16px; text-decoration: none; color: #4E433A; font-size: 11px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10 M10 20V4 M16 20v-7 M22 20H2"></path></svg>Stats</a>
</nav>

<sc-if value="{{isOpen}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; inset: 0; display: grid; place-items: center; padding: 20px; box-sizing: border-box; background: rgba(42,33,27,0.22); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); animation: sbFade 0.25s ease both">
<section role="dialog" aria-label="{{cur.name}} — choose difficulty" style="{{sheetStyle}}">
<div style="display: flex; justify-content: space-between; align-items: flex-start">
<span style="{{cur.bigTile}}" aria-hidden="true"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="{{cur.ink}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{cur.path}}"></path></svg></span>
<button onClick="{{close}}" aria-label="Close" style="width: 44px; height: 44px; border-radius: 12px; padding: 0; display: grid; place-items: center; background: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.9)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2A211B" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12 M18 6L6 18"></path></svg></button>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; animation: sbRise 0.35s 0.15s ease both">
<h3 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -0.01em">{{cur.name}}</h3>
<p style="margin: 0; color: #4E433A; font-size: 14px">{{cur.rules}}</p>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; animation: sbRise 0.35s 0.22s ease both">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #6B5D52">Choose difficulty</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{levels}}" as="l" hint-placeholder-count="4">
<button onClick="{{l.pick}}" aria-pressed="{{l.on}}" style="{{l.style}}">
<span style="display: flex; gap: 3px; align-items: flex-end" aria-hidden="true"><span style="{{l.b1}}"></span><span style="{{l.b2}}"></span><span style="{{l.b3}}"></span><span style="{{l.b4}}"></span></span>
<span style="display: flex; flex-direction: column; align-items: flex-start"><span style="font-weight: 700; font-size: 15px">{{l.name}}</span><span style="font-size: 12px; color: #6B5D52">{{l.note}}</span></span>
</button>
</sc-for>
</div>
</div>
<a href="{{playHref}}" style="min-height: 50px; border-radius: 12px; background: #2A211B; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; animation: sbRise 0.35s 0.3s ease both"><svg width="18" height="18" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"></path></svg>Play {{levelName}}</a>
</section>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const G = [
      { id: 'star', name: 'Star Battle', count: '60 puzzles', bg: '#FBE3D6', ink: '#C24E2A', path: 'M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.5 6.7 19.4l1.2-6L3.4 9.3l6-.7z', rules: 'One star in every row, column and region. Stars never touch.', href: 'StarBattle.dc.html', origin: '25% 30%' },
      { id: 'sudoku', name: 'Sudoku', count: 'Classic + variants', bg: '#D7EEEA', ink: '#1F6F73', path: 'M4 4h16v16H4z M4 9.3h16 M4 14.7h16 M9.3 4v16 M14.7 4v16', rules: 'Every row, column and box holds each number once.', href: 'Sudoku.dc.html', origin: '75% 30%' },
      { id: 'binairo', name: 'Binairo', count: '30 puzzles', bg: '#F8EBC9', ink: '#8C5F00', path: 'M3 12a4.5 4.5 0 1 0 9 0a4.5 4.5 0 1 0 -9 0 M12 12a4.5 4.5 0 1 0 9 0a4.5 4.5 0 1 0 -9 0', rules: 'Balance two symbols in every row and column — never three in a row.', href: '#binairo', origin: '25% 50%' },
      { id: 'shikaku', name: 'Shikaku', count: '30 puzzles', bg: '#F8DDE5', ink: '#A8325A', path: 'M3 3h8v11H3z M13 3h8v6h-8z M13 11h8v10h-8z M3 16h8v5H3z', rules: 'Split the grid into rectangles, each the size of its number.', href: '#shikaku', origin: '75% 50%' },
      { id: 'word', name: 'Five Letters', count: 'Unlimited', bg: '#ECE2F7', ink: '#6A45B0', path: 'M2 8h5.5v8H2z M9.25 8h5.5v8h-5.5z M16.5 8H22v8h-5.5z', rules: 'Guess the hidden five-letter word in six tries.', href: '#word', origin: '25% 70%' },
      { id: 'groups', name: 'Groups', count: 'Handmade', bg: '#DDEFD9', ink: '#2F6B4A', path: 'M4 4h6v6H4z M14 4h6v6h-6z M4 14h6v6H4z M14 14h6v6h-6z', rules: 'Sort sixteen words into four hidden groups of four.', href: '#groups', origin: '75% 70%' }
    ];
    const tile = (bg, s) => 'width: ' + s + 'px; height: ' + s + 'px; border-radius: ' + Math.round(s / 4.5) + 'px; display: grid; place-items: center; background: ' + bg;
    const games = G.map((g) => ({ ...g, tile: tile(g.bg, 56), open: () => this.setState({ open: g.id, level: 'Medium' }) }));
    const cur = G.find((g) => g.id === st.open) || G[0];
    const level = st.level || 'Medium';
    const L = [['Easy', 'Warm-up', 1], ['Medium', 'Some thinking', 2], ['Hard', 'Real deductions', 3], ['Expert', 'No mercy', 4]];
    const bar = (h, on) => 'width: 5px; height: ' + h + 'px; border-radius: 2px; background: ' + (on ? '#2A211B' : 'rgba(42,33,27,0.18)');
    const levels = L.map(([name, note, n]) => {
      const on = name === level;
      return {
        name, note, on: on ? 'true' : 'false',
        b1: bar(8, n >= 1), b2: bar(12, n >= 2), b3: bar(16, n >= 3), b4: bar(20, n >= 4),
        style: 'display: flex; align-items: center; gap: 10px; padding: 12px; min-height: 60px; box-sizing: border-box; border-radius: 12px; text-align: left; font-family: Inter, sans-serif; color: #2A211B; background: ' + (on ? 'rgba(255,255,255,0.92)' : 'rgba(255,255,255,0.4)') + '; border: ' + (on ? '2px solid #2A211B' : '1px solid rgba(255,255,255,0.9)'),
        pick: () => this.setState({ level: name })
      };
    });
    return {
      games, levels, levelName: level,
      playHref: cur.id === 'star' ? (level === 'Hard' || level === 'Expert' ? 'StarBattle8.dc.html' : 'StarBattle.dc.html') : cur.id === 'sudoku' ? (level === 'Easy' ? 'Sudoku.dc.html' : 'Sudoku9.dc.html') : cur.href,
      isOpen: !!st.open,
      cur: { ...cur, bigTile: tile(cur.bg, 72) },
      sheetStyle: 'width: 100%; box-sizing: border-box; padding: 20px; border-radius: 20px; display: flex; flex-direction: column; gap: 16px; background: rgba(255,255,255,0.62); -webkit-backdrop-filter: blur(28px) saturate(170%); backdrop-filter: blur(28px) saturate(170%); border: 1px solid rgba(255,255,255,0.9); box-shadow: 0 24px 60px rgba(30,30,30,0.22), inset 0 1px 0 rgba(255,255,255,1); transform-origin: ' + cur.origin + '; animation: sbPop 0.45s cubic-bezier(0.2, 0.9, 0.3, 1) both',
      close: () => this.setState({ open: null })
    };
  }
}
</script>
</body>
</html>

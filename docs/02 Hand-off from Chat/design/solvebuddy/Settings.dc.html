<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SolveBuddy — Profile &amp; settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;overflow:hidden;scrollbar-width:none}
::-webkit-scrollbar{display:none}
a{color:#C24E2A}a:hover{color:#9A3B1F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F6F4F1; color: #2A211B; font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.35">
<div aria-hidden="true" style="position: absolute; top: -80px; right: -90px; width: 280px; height: 280px; border-radius: 50%; background: #DCE9F2; opacity: 0.7; filter: blur(50px)"></div>
<div aria-hidden="true" style="position: absolute; top: 460px; left: -120px; width: 260px; height: 260px; border-radius: 50%; background: #BFE3D8; opacity: 0.6; filter: blur(50px)"></div>

<div style="position: relative; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 12px">

<header style="display: flex; align-items: center; gap: 10px">
<a href="Main.dc.html" aria-label="Back to library" style="width: 44px; height: 44px; border-radius: 12px; box-sizing: border-box; display: grid; place-items: center; color: #2A211B; background: rgba(255,255,255,0.3); -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%); border: 1px solid rgba(255,255,255,0.75); box-shadow: 0 6px 18px rgba(30,30,30,0.07), inset 0 1px 0 rgba(255,255,255,0.9)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5 M11 6l-6 6 6 6"></path></svg></a>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -0.01em">Profile &amp; settings</h1>
</header>

<a href="#profile" style="display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 16px; text-decoration: none; color: #2A211B; background: rgba(255,255,255,0.4); -webkit-backdrop-filter: blur(16px) saturate(160%); backdrop-filter: blur(16px) saturate(160%); border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 8px 22px rgba(30,30,30,0.06), inset 0 1px 0 rgba(255,255,255,0.95)">
<span aria-hidden="true" style="width: 56px; height: 56px; flex: none; border-radius: 50%; background: #FBE3D6; display: grid; place-items: center; font: 800 24px 'Bricolage Grotesque', sans-serif; color: #A23F20; box-shadow: inset 0 0 0 3px #FFFFFF, 0 4px 12px rgba(30,30,30,0.1)">C</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 700; font-size: 17px">Colin</span><span style="display: flex; align-items: center; gap: 4px; font-size: 13px; color: #6B5D52"><svg width="13" height="13" viewBox="0 0 24 24" fill="#E8743F" aria-hidden="true"><path d="M12 2c1.2 3.4 5 5.2 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5.2 1.6 1 2.6 2 3 0-3.5.3-6 1-8.5z"></path></svg>5-day streak · 47 solved</span></span>
<span style="font-size: 13px; font-weight: 600; color: #4E433A">Edit</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B5D52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</a>

<sc-for list="{{groups}}" as="grp" hint-placeholder-count="3">
<section style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0 4px; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #6B5D52"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{grp.ink}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{grp.icon}}"></path></svg>{{grp.title}}</h2>
<div style="border-radius: 14px; overflow: hidden; background: rgba(255,255,255,0.4); -webkit-backdrop-filter: blur(16px) saturate(160%); backdrop-filter: blur(16px) saturate(160%); border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 8px 22px rgba(30,30,30,0.06), inset 0 1px 0 rgba(255,255,255,0.95)">
<sc-for list="{{grp.rows}}" as="t" hint-placeholder-count="2">
<div style="{{t.rowStyle}}">
<span style="flex: 1; font-size: 15px">{{t.label}}</span>
<button role="switch" aria-checked="{{t.checked}}" aria-label="{{t.label}}" onClick="{{t.flip}}" style="{{t.track}}"><span style="{{t.knob}}"></span></button>
</div>
</sc-for>
</div>
</section>
</sc-for>

<section style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0 4px; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #6B5D52"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6A45B0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"></path></svg>Appearance</h2>
<div style="border-radius: 14px; padding: 10px 14px; display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.4); -webkit-backdrop-filter: blur(16px) saturate(160%); backdrop-filter: blur(16px) saturate(160%); border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 8px 22px rgba(30,30,30,0.06), inset 0 1px 0 rgba(255,255,255,0.95)">
<span style="flex: 1">Theme</span>
<div style="width: 190px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; padding: 3px; border-radius: 10px; background: rgba(42,33,27,0.06)">
<sc-for list="{{theme}}" as="o" hint-placeholder-count="3"><button onClick="{{o.pick}}" aria-pressed="{{o.on}}" style="{{o.style}}">{{o.label}}</button></sc-for>
</div>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 6px">
<h2 style="margin: 0 4px; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #6B5D52"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2F6B4A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8l-9-5-9 5 9 5z M3 8v8l9 5 9-5V8 M12 13v8"></path></svg>Offline</h2>
<div style="border-radius: 14px; overflow: hidden; background: rgba(255,255,255,0.4); -webkit-backdrop-filter: blur(16px) saturate(160%); backdrop-filter: blur(16px) saturate(160%); border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 8px 22px rgba(30,30,30,0.06), inset 0 1px 0 rgba(255,255,255,0.95)">
<sc-for list="{{offline}}" as="t" hint-placeholder-count="1">
<div style="{{t.rowStyle}}">
<span style="flex: 1; font-size: 15px">{{t.label}}</span>
<button role="switch" aria-checked="{{t.checked}}" aria-label="{{t.label}}" onClick="{{t.flip}}" style="{{t.track}}"><span style="{{t.knob}}"></span></button>
</div>
</sc-for>
<a href="Packs.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 0 14px; min-height: 48px; border-top: 1px solid rgba(42,33,27,0.08); text-decoration: none; color: #2A211B">
<span style="flex: 1">Manage packs</span><span style="font-size: 13px; color: #6B5D52">3 saved</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B5D52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</a>
</div>
</section>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const on = Object.assign({ timer: true, mistakes: false, haptics: true, hl: true, same: true, auto: true, wifi: true }, st.on || {});
    const row = (i) => 'display: flex; align-items: center; gap: 12px; padding: 0 14px; min-height: 46px; box-sizing: border-box' + (i ? '; border-top: 1px solid rgba(42,33,27,0.08)' : '');
    const make = (list) => list.map(([id, label], i) => ({
      label, rowStyle: row(i), checked: String(!!on[id]),
      track: 'width: 50px; height: 30px; flex: none; padding: 0; border: none; border-radius: 15px; position: relative; background: ' + (on[id] ? '#2A211B' : 'rgba(42,33,27,0.16)') + '; transition: background 0.2s ease',
      knob: 'position: absolute; top: 3px; left: ' + (on[id] ? '23px' : '3px') + '; width: 24px; height: 24px; border-radius: 12px; background: #FFFFFF; box-shadow: 0 2px 6px rgba(0,0,0,0.2); transition: left 0.2s ease',
      flip: () => this.setState({ on: Object.assign({}, on, { [id]: !on[id] }) })
    }));
    const theme = ['Light', 'Dark', 'Auto'].map((label) => {
      const cur = (st.th || 'Auto') === label;
      return {
        label, on: String(cur),
        style: 'min-height: 34px; border-radius: 8px; border: none; font: ' + (cur ? '700' : '500') + ' 13px Inter, sans-serif; color: #2A211B; background: ' + (cur ? '#FFFFFF' : 'transparent') + '; box-shadow: ' + (cur ? '0 1px 4px rgba(30,30,30,0.12)' : 'none'),
        pick: () => this.setState({ th: label })
      };
    });
    return {
      groups: [
        { title: 'All puzzles', ink: '#2A211B', icon: 'M4 4h6v6H4z M14 4h6v6h-6z M4 14h6v6H4z M14 14h6v6h-6z', rows: make([['timer', 'Show timer'], ['mistakes', 'Show mistakes as I play'], ['haptics', 'Haptics']]) },
        { title: 'Sudoku', ink: '#1F6F73', icon: 'M4 4h16v16H4z M4 9.3h16 M4 14.7h16 M9.3 4v16 M14.7 4v16', rows: make([['hl', 'Highlight row, column & box'], ['same', 'Highlight matching numbers']]) },
        { title: 'Star Battle', ink: '#C24E2A', icon: 'M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.5 6.7 19.4l1.2-6L3.4 9.3l6-.7z', rows: make([['auto', 'Auto-cross around stars']]) }
      ],
      offline: make([['wifi', 'Download packs on Wi-Fi only']]),
      theme
    };
  }
}
</script>
</body>
</html>

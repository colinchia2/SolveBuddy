<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SolveBuddy — Stats</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;overflow:hidden;scrollbar-width:none}
::-webkit-scrollbar{display:none}
a{color:#C24E2A}a:hover{color:#9A3B1F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F6F4F1; color: #2A211B; font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.35">
<div aria-hidden="true" style="position: absolute; top: -80px; left: -90px; width: 280px; height: 280px; border-radius: 50%; background: #E8E4F3; opacity: 0.7; filter: blur(50px)"></div>
<div aria-hidden="true" style="position: absolute; top: 420px; right: -120px; width: 260px; height: 260px; border-radius: 50%; background: #DCE9F2; opacity: 0.7; filter: blur(50px)"></div>
<div aria-hidden="true" style="position: absolute; bottom: -40px; left: -40px; width: 240px; height: 240px; border-radius: 50%; background: #BFE3D8; opacity: 0.6; filter: blur(50px)"></div>

<div style="position: relative; padding: 24px 16px 110px; display: flex; flex-direction: column; gap: 14px">

<h1 style="margin: 0; display: flex; align-items: center; gap: 10px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; letter-spacing: -0.01em"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#C24E2A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10 M10 20V4 M16 20v-7 M22 20H2"></path></svg>Stats</h1>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<div style="padding: 12px; border-radius: 14px; display: flex; flex-direction: column; gap: 4px; background: rgba(255,255,255,0.4); -webkit-backdrop-filter: blur(16px) saturate(160%); backdrop-filter: blur(16px) saturate(160%); border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 8px 22px rgba(30,30,30,0.06), inset 0 1px 0 rgba(255,255,255,0.95)">
<svg width="20" height="20" viewBox="0 0 24 24" fill="#E8743F" aria-hidden="true"><path d="M12 2c1.2 3.4 5 5.2 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5.2 1.6 1 2.6 2 3 0-3.5.3-6 1-8.5z"></path></svg>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px; line-height: 1">5</span><span style="font-size: 12px; color: #6B5D52">Day streak</span>
</div>
<div style="padding: 12px; border-radius: 14px; display: flex; flex-direction: column; gap: 4px; background: rgba(255,255,255,0.4); -webkit-backdrop-filter: blur(16px) saturate(160%); backdrop-filter: blur(16px) saturate(160%); border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 8px 22px rgba(30,30,30,0.06), inset 0 1px 0 rgba(255,255,255,0.95)">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2F6B4A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8 12l3 3 5-6"></path></svg>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px; line-height: 1">47</span><span style="font-size: 12px; color: #6B5D52">Solved</span>
</div>
<div style="padding: 12px; border-radius: 14px; display: flex; flex-direction: column; gap: 4px; background: rgba(255,255,255,0.4); -webkit-backdrop-filter: blur(16px) saturate(160%); backdrop-filter: blur(16px) saturate(160%); border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 8px 22px rgba(30,30,30,0.06), inset 0 1px 0 rgba(255,255,255,0.95)">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8C5F00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8 M12 17v4 M7 4h10v5a5 5 0 0 1-10 0z M7 6H4v2a3 3 0 0 0 3 3 M17 6h3v2a3 3 0 0 1-3 3"></path></svg>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px; line-height: 1">12</span><span style="font-size: 12px; color: #6B5D52">Best streak</span>
</div>
</div>

<section style="padding: 14px; border-radius: 14px; display: flex; flex-direction: column; gap: 10px; background: rgba(255,255,255,0.4); -webkit-backdrop-filter: blur(16px) saturate(160%); backdrop-filter: blur(16px) saturate(160%); border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 8px 22px rgba(30,30,30,0.06), inset 0 1px 0 rgba(255,255,255,0.95)">
<div style="display: flex; justify-content: space-between; align-items: center">
<h2 style="margin: 0; display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 700"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#2A211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v15H4z M4 10h16 M9 3v4 M15 3v4"></path></svg>October</h2>
<span style="font-size: 12px; color: #6B5D52">Puzzles per day</span>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{days}}" as="d" hint-placeholder-count="7"><span style="font-size: 11px; font-weight: 600; text-align: center; color: #6B5D52">{{d}}</span></sc-for>
<sc-for list="{{heat}}" as="h" hint-placeholder-count="35"><span style="{{h.style}}" aria-label="{{h.label}}"></span></sc-for>
</div>
<div style="display: flex; justify-content: flex-end; align-items: center; gap: 4px; font-size: 11px; color: #6B5D52">Less<sc-for list="{{legend}}" as="l" hint-placeholder-count="5"><span style="{{l}}"></span></sc-for>More</div>
</section>

<section style="padding: 14px; border-radius: 14px; display: flex; flex-direction: column; gap: 12px; background: rgba(255,255,255,0.4); -webkit-backdrop-filter: blur(16px) saturate(160%); backdrop-filter: blur(16px) saturate(160%); border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 8px 22px rgba(30,30,30,0.06), inset 0 1px 0 rgba(255,255,255,0.95)">
<h2 style="margin: 0; display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 700"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#2A211B" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h6v6H4z M14 4h6v6h-6z M4 14h6v6H4z M14 14h6v6h-6z"></path></svg>By puzzle</h2>
<sc-for list="{{games}}" as="g" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 10px">
<span style="{{g.tile}}" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{g.ink}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{g.path}}"></path></svg></span>
<div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; justify-content: space-between; font-size: 14px"><span style="font-weight: 600">{{g.name}}</span><span style="color: #4E433A">{{g.solved}} solved · avg {{g.avg}}</span></div>
<div style="height: 6px; border-radius: 3px; background: rgba(42,33,27,0.08)"><div style="{{g.bar}}"></div></div>
</div>
</div>
</sc-for>
</section>

<section style="padding: 12px 14px; border-radius: 14px; display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.4); -webkit-backdrop-filter: blur(16px) saturate(160%); backdrop-filter: blur(16px) saturate(160%); border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 8px 22px rgba(30,30,30,0.06), inset 0 1px 0 rgba(255,255,255,0.95)">
<svg width="52" height="52" viewBox="0 0 36 36" role="img" aria-label="68 percent solved without hints"><circle cx="18" cy="18" r="15" fill="none" stroke="rgba(42,33,27,0.1)" stroke-width="4"></circle><circle cx="18" cy="18" r="15" fill="none" stroke="#C24E2A" stroke-width="4" stroke-linecap="round" stroke-dasharray="64 94.2" transform="rotate(-90 18 18)"></circle></svg>
<div style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 700">68% solved without hints</span><span style="font-size: 13px; color: #6B5D52">Most-used hint: confined region</span></div>
</section>

</div>

<nav aria-label="Tabs" style="position: absolute; left: 40px; right: 40px; bottom: 18px; height: 66px; box-sizing: border-box; padding: 6px; border-radius: 22px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: rgba(255,255,255,0.28); -webkit-backdrop-filter: blur(24px) saturate(170%); backdrop-filter: blur(24px) saturate(170%); border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 12px 32px rgba(30,30,30,0.12), inset 0 1px 0 rgba(255,255,255,0.95)">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 16px; text-decoration: none; color: #4E433A; font-size: 11px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h6v6H4z M14 4h6v6h-6z M4 14h6v6H4z M14 14h6v6h-6z"></path></svg>Library</a>
<a href="Packs.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 16px; text-decoration: none; color: #4E433A; font-size: 11px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8l-9-5-9 5 9 5z M3 8v8l9 5 9-5V8 M12 13v8"></path></svg>Packs</a>
<a href="Stats.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 16px; background: rgba(255,255,255,0.7); box-shadow: inset 0 1px 0 rgba(255,255,255,1), 0 2px 8px rgba(30,30,30,0.06); text-decoration: none; color: #2A211B; font-size: 11px; font-weight: 700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10 M10 20V4 M16 20v-7 M22 20H2"></path></svg>Stats</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const shades = ['rgba(42,33,27,0.07)', '#F6D5C3', '#EFAE8D', '#DE8058', '#C24E2A'];
    const vals = [0,1,2,0,3,1,0, 2,2,1,0,1,3,2, 0,1,4,2,1,0,2, 3,2,1,2,0,1,3, 2,4,0,0,0,0,0];
    const today = 29;
    const heat = vals.map((v, i) => ({
      label: i > today ? 'Upcoming' : v + ' puzzles',
      style: 'aspect-ratio: 1; border-radius: 6px; background: ' + (i > today ? 'transparent' : shades[v]) + (i > today ? '; border: 1px dashed rgba(42,33,27,0.15)' : '') + (i === today ? '; box-shadow: 0 0 0 2px #2A211B' : '')
    }));
    const legend = shades.map((s) => 'width: 12px; height: 12px; border-radius: 3px; background: ' + s);
    const tile = (bg) => 'width: 34px; height: 34px; flex: none; border-radius: 9px; display: grid; place-items: center; background: ' + bg;
    const G = [
      ['Star Battle', 18, '3:12', '#FBE3D6', '#C24E2A', 'M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.5 6.7 19.4l1.2-6L3.4 9.3l6-.7z'],
      ['Sudoku', 21, '4:05', '#D7EEEA', '#1F6F73', 'M4 4h16v16H4z M4 9.3h16 M4 14.7h16 M9.3 4v16 M14.7 4v16'],
      ['Binairo', 6, '1:58', '#F8EBC9', '#8C5F00', 'M3 12a4.5 4.5 0 1 0 9 0a4.5 4.5 0 1 0 -9 0 M12 12a4.5 4.5 0 1 0 9 0a4.5 4.5 0 1 0 -9 0'],
      ['Shikaku', 2, '2:40', '#F8DDE5', '#A8325A', 'M3 3h8v11H3z M13 3h8v6h-8z M13 11h8v10h-8z M3 16h8v5H3z']
    ];
    const games = G.map(([name, solved, avg, bg, ink, path]) => ({
      name, solved, avg, ink, path, tile: tile(bg),
      bar: 'height: 6px; border-radius: 3px; width: ' + Math.round(solved / 21 * 100) + '%; background: ' + ink
    }));
    return { days: ['M', 'T', 'W', 'T', 'F', 'S', 'S'], heat, legend, games };
  }
}
</script>
</body>
</html>

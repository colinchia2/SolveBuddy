<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SolveBuddy — Mini Sudoku</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;overflow:hidden;scrollbar-width:none}
::-webkit-scrollbar{display:none}
a{color:#C24E2A}a:hover{color:#9A3B1F}
@keyframes sbUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F6F4F1; color: #2A211B; font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.4">
<div aria-hidden="true" style="position: absolute; top: -90px; right: -80px; width: 280px; height: 280px; border-radius: 50%; background: #BFE3D8; opacity: 0.6; filter: blur(50px)"></div>
<div aria-hidden="true" style="position: absolute; top: 600px; left: -110px; width: 280px; height: 280px; border-radius: 50%; background: #DCE9F2; opacity: 0.7; filter: blur(50px)"></div>

<div style="position: relative; height: 844px; box-sizing: border-box; padding: 16px 16px 28px; display: flex; flex-direction: column; gap: 14px">

<header style="display: flex; align-items: center; gap: 6px">
<a href="Main.dc.html" aria-label="Back to library" style="width: 44px; height: 44px; border-radius: 12px; box-sizing: border-box; display: grid; place-items: center; color: #2A211B; background: rgba(255,255,255,0.3); -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%); border: 1px solid rgba(255,255,255,0.75); box-shadow: 0 6px 18px rgba(30,30,30,0.07), inset 0 1px 0 rgba(255,255,255,0.9)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5 M11 6l-6 6 6 6"></path></svg></a>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 21px; line-height: 1.1">Mini Sudoku</span>
<span style="font-size: 12px; color: #6B5D52">Classic 6×6 · Easy</span>
</div>
<button onClick="{{openRules}}" aria-label="How to play" style="width: 44px; height: 44px; border-radius: 12px; padding: 0; display: grid; place-items: center; background: rgba(255,255,255,0.3); -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%); border: 1px solid rgba(255,255,255,0.75); box-shadow: 0 6px 18px rgba(30,30,30,0.07), inset 0 1px 0 rgba(255,255,255,0.9)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2A211B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14 M12 17.5v.01"></path></svg></button>
<button aria-label="Undo" style="width: 44px; height: 44px; border-radius: 12px; padding: 0; display: grid; place-items: center; background: rgba(255,255,255,0.3); -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%); border: 1px solid rgba(255,255,255,0.75); box-shadow: 0 6px 18px rgba(30,30,30,0.07), inset 0 1px 0 rgba(255,255,255,0.9)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2A211B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14l-5-5 5-5 M4 9h10a6 6 0 0 1 0 12h-3"></path></svg></button>
<button onClick="{{openHint}}" aria-label="Hint" aria-pressed="{{hintOn}}" style="{{hintBtn}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C24E2A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6 M10 21h4 M12 3a6 6 0 0 0-3.5 10.9c.6.4 1 1.1 1 1.8V16h5v-.3c0-.7.4-1.4 1-1.8A6 6 0 0 0 12 3z"></path></svg></button>
</header>

<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
<span style="display: flex; align-items: center; gap: 6px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2A211B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>0:48</span>
<button onClick="{{restart}}" style="min-height: 36px; padding: 0 12px; border-radius: 10px; display: flex; align-items: center; gap: 6px; font: 600 13px Inter, sans-serif; color: #2A211B; background: rgba(255,255,255,0.3); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); border: 1px solid rgba(255,255,255,0.75); box-shadow: 0 4px 12px rgba(30,30,30,0.06), inset 0 1px 0 rgba(255,255,255,0.9)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7 M3 4v5h5"></path></svg>Restart</button>
</div>

<div style="align-self: center; margin-top: 6px; display: grid; grid-template-columns: repeat(6, 56px); border-top: 3px solid #2A211B; border-left: 3px solid #2A211B; border-radius: 10px; overflow: hidden; background: #FFFDF9; box-shadow: 0 12px 32px rgba(30,30,30,0.12)">
<sc-for list="{{cells}}" as="cell" hint-placeholder-count="36">
<button onClick="{{cell.pick}}" aria-label="{{cell.label}}" style="{{cell.style}}">
<sc-if value="{{cell.hasVal}}" hint-placeholder-val="{{false}}"><span style="{{cell.valStyle}}">{{cell.v}}</span></sc-if>
<sc-if value="{{cell.hasCenter}}" hint-placeholder-val="{{false}}"><span style="font-size: 13px; font-weight: 600; letter-spacing: -0.02em; color: #2F5FB8">{{cell.center}}</span></sc-if>
<sc-for list="{{cell.corner}}" as="n" hint-placeholder-count="0"><span style="{{n.style}}">{{n.d}}</span></sc-for>
</button>
</sc-for>
</div>

<div style="margin-top: auto; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; padding: 4px; border-radius: 14px; background: rgba(255,255,255,0.3); -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%); border: 1px solid rgba(255,255,255,0.75); box-shadow: 0 6px 18px rgba(30,30,30,0.06), inset 0 1px 0 rgba(255,255,255,0.9)">
<button onClick="{{setNormal}}" aria-pressed="{{pNormal}}" style="{{sNormal}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v16H4z"></path><path d="M10.5 9l2-1.5V16" stroke-linecap="round"></path></svg>Normal</button>
<button onClick="{{setCorner}}" aria-pressed="{{pCorner}}" style="{{sCorner}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v16H4z"></path><circle cx="8" cy="8" r="1.3" fill="currentColor"></circle><circle cx="16" cy="8" r="1.3" fill="currentColor"></circle><circle cx="8" cy="16" r="1.3" fill="currentColor"></circle><circle cx="16" cy="16" r="1.3" fill="currentColor"></circle></svg>Corner</button>
<button onClick="{{setCenter}}" aria-pressed="{{pCenter}}" style="{{sCenter}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v16H4z"></path><circle cx="9.5" cy="12" r="1.3" fill="currentColor"></circle><circle cx="14.5" cy="12" r="1.3" fill="currentColor"></circle></svg>Center</button>
<button onClick="{{erase}}" style="min-height: 48px; border-radius: 10px; border: none; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font: 600 11px Inter, sans-serif; color: #4E433A"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 5H8l-6 7 6 7h13z M11 9l6 6 M17 9l-6 6"></path></svg>Erase</button>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{pad}}" as="k" hint-placeholder-count="6">
<button onClick="{{k.press}}" aria-label="{{k.label}}" style="{{k.style}}">{{k.d}}</button>
</sc-for>
</div>

</div>

<sc-if value="{{hintOpen}}" hint-placeholder-val="{{false}}">
<section aria-label="Hint" style="position: absolute; left: 12px; right: 12px; bottom: 16px; box-sizing: border-box; padding: 16px; border-radius: 18px; display: flex; flex-direction: column; gap: 8px; background: rgba(255,255,255,0.72); -webkit-backdrop-filter: blur(28px) saturate(170%); backdrop-filter: blur(28px) saturate(170%); border: 1px solid rgba(255,255,255,0.95); box-shadow: 0 16px 44px rgba(30,30,30,0.2), inset 0 1px 0 rgba(255,255,255,1); animation: sbUp 0.35s cubic-bezier(0.2,0.9,0.3,1) both">
<div style="display: flex; justify-content: space-between; align-items: center">
<div style="display: flex; align-items: center; gap: 8px">
<svg width="26" height="26" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="45" fill="#4D96FF"></circle><g fill="#FFFFFF" stroke="#5D4E37" stroke-width="3" stroke-linejoin="round"><path d="M33 22 A8 8 0 0 1 38 36.2 L37 41 H29 L28 36.2 A8 8 0 0 1 33 22 Z"></path><path d="M67 22 A8 8 0 0 1 72 36.2 L71 41 H63 L62 36.2 A8 8 0 0 1 67 22 Z"></path></g><path d="M29.5 45 H36.5 M30.5 49 H35.5 M63.5 45 H70.5 M64.5 49 H69.5" stroke="#5D4E37" stroke-width="3" stroke-linecap="round"></path><path d="M25 57 Q50 85 75 57" stroke="#5D4E37" stroke-width="4" fill="none" stroke-linecap="round"></path></svg>
<span style="font-weight: 700">{{stepName}}</span>
</div>
<div style="display: flex; align-items: center; gap: 8px">
<div style="display: flex; gap: 4px" aria-hidden="true"><span style="{{dot1}}"></span><span style="{{dot2}}"></span><span style="{{dot3}}"></span></div>
<button onClick="{{closeHint}}" aria-label="Close hint" style="width: 36px; height: 36px; border-radius: 10px; padding: 0; display: grid; place-items: center; background: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.9)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2A211B" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12 M18 6L6 18"></path></svg></button>
</div>
</div>
<p style="margin: 0; font-weight: 600; font-size: 16px">{{hintTitle}}</p>
<p style="margin: 0; color: #4E433A; font-size: 14px">{{hintBody}}</p>
<button onClick="{{advance}}" style="min-height: 46px; border-radius: 12px; border: none; background: #2A211B; font: 600 14px Inter, sans-serif; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 6px">{{advanceLabel}}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14 M13 6l6 6-6 6"></path></svg></button>
</section>
</sc-if>

<sc-if value="{{showRules}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; inset: 0; display: flex; align-items: flex-end; background: rgba(42,33,27,0.22); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px)">
<section role="dialog" aria-label="How to play Mini Sudoku" style="width: 100%; box-sizing: border-box; padding: 20px 20px 28px; border-radius: 22px 22px 0 0; display: flex; flex-direction: column; gap: 14px; background: rgba(255,255,255,0.72); -webkit-backdrop-filter: blur(28px) saturate(170%); backdrop-filter: blur(28px) saturate(170%); border-top: 1px solid rgba(255,255,255,0.95); box-shadow: 0 -12px 40px rgba(30,30,30,0.16); animation: sbUp 0.35s cubic-bezier(0.2,0.9,0.3,1) both">
<div style="display: flex; justify-content: space-between; align-items: center">
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px">How to play</h2>
<button onClick="{{closeRules}}" aria-label="Close" style="width: 44px; height: 44px; border-radius: 12px; padding: 0; display: grid; place-items: center; background: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.9)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2A211B" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12 M18 6L6 18"></path></svg></button>
</div>
<div style="display: flex; gap: 12px; align-items: flex-start"><span style="width: 32px; height: 32px; flex: none; border-radius: 9px; background: #D7EEEA; display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F6F73" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v16H4z M4 9.3h16 M4 14.7h16 M12 4v16"></path></svg></span><span>Fill every row, column and 2×3 box with the numbers <strong>1 to 6</strong> — each exactly once.</span></div>
<div style="display: flex; gap: 12px; align-items: flex-start"><span style="width: 32px; height: 32px; flex: none; border-radius: 9px; background: #DCE9F2; display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2F5FB8" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v16H4z"></path><circle cx="8" cy="8" r="1.3" fill="#2F5FB8"></circle><circle cx="16" cy="16" r="1.3" fill="#2F5FB8"></circle></svg></span><span><strong>Corner</strong> marks: numbers that must go in one of a few cells in a box.</span></div>
<div style="display: flex; gap: 12px; align-items: flex-start"><span style="width: 32px; height: 32px; flex: none; border-radius: 9px; background: #DCE9F2; display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2F5FB8" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v16H4z"></path><circle cx="9.5" cy="12" r="1.3" fill="#2F5FB8"></circle><circle cx="14.5" cy="12" r="1.3" fill="#2F5FB8"></circle></svg></span><span><strong>Center</strong> marks: every number this one cell could still be.</span></div>
<button onClick="{{closeRules}}" style="min-height: 50px; border-radius: 12px; border: none; background: #2A211B; color: #FFFFFF; font: 700 15px Inter, sans-serif">Got it</button>
</section>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const sel = st.sel || '0,1';
    const mode = st.mode || 'normal';
    const hint = st.hint || 0;
    const entries = st.entries || { '0,1': 2, '1,0': 4 };
    const corner = st.corner || { '4,4': [4, 5] };
    const center = st.center || { '5,3': [3, 5] };
    const S = [[1,2,3,4,5,6],[4,5,6,1,2,3],[2,3,1,5,6,4],[5,6,4,2,3,1],[3,1,2,6,4,5],[6,4,5,3,1,2]];
    const G = [[1,0,0,4,0,0],[0,5,0,0,2,0],[2,3,0,0,6,0],[5,6,4,0,0,1],[0,0,2,6,0,0],[0,4,0,0,1,2]];
    const ent = Object.assign({}, entries);
    if (hint === 3) ent['2,2'] = 1;
    const [sr, sc] = sel.split(',').map(Number);
    const selVal = G[sr][sc] || ent[sel] || 0;
    const thick = '3px solid #2A211B', thin = '1px solid #E6DACD';
    const pos = ['top: 3px; left: 5px', 'top: 3px; right: 5px', 'bottom: 3px; left: 5px', 'bottom: 3px; right: 5px', 'top: 3px; left: 0; right: 0; text-align: center', 'bottom: 3px; left: 0; right: 0; text-align: center'];
    const cells = [];
    for (let r = 0; r < 6; r++) {
      for (let c = 0; c < 6; c++) {
        const key = r + ',' + c, g = G[r][c], v = g || ent[key] || 0;
        const isSel = key === sel && !hint;
        const peer = !hint && (r === sr || c === sc || (Math.floor(r / 2) === Math.floor(sr / 2) && Math.floor(c / 3) === Math.floor(sc / 3)));
        const same = !hint && selVal && v === selVal && key !== sel;
        const inBox = hint >= 1 && r >= 2 && r <= 3 && c <= 2;
        const target = hint >= 2 && r === 2 && c === 2;
        let bg = '#FFFDF9';
        if (peer) bg = '#EEF3FA';
        if (same) bg = '#D7E4F8';
        if (isSel) bg = '#C9DBF7';
        if (inBox) bg = '#FBE3D6';
        if (target) bg = '#F4C7B2';
        const ring = target ? 'inset 0 0 0 3px #C24E2A' : isSel ? 'inset 0 0 0 2px #2F6FD6' : 'none';
        const br = (c === 2 || c === 5) ? thick : thin;
        const bb = (r % 2 === 1) ? thick : thin;
        const cn = (!v && corner[key]) ? corner[key].slice().sort((a, b) => a - b) : [];
        const ce = (!v && center[key]) ? center[key].slice().sort((a, b) => a - b).join('') : '';
        cells.push({
          v, hasVal: !!v, hasCenter: !!ce, center: ce,
          corner: cn.map((d, i) => ({ d, style: 'position: absolute; ' + pos[i] + '; font-size: 11px; font-weight: 600; line-height: 1; color: #2F5FB8' })),
          valStyle: 'font: ' + (g ? '700' : '600') + ' 26px Inter, sans-serif; color: ' + (g ? '#2A211B' : (target ? '#A23F20' : '#2F5FB8')),
          label: 'Row ' + (r + 1) + ' column ' + (c + 1) + (v ? ', ' + v : ', empty'),
          style: 'position: relative; width: 56px; height: 56px; box-sizing: border-box; margin: 0; padding: 0; border: none; display: grid; place-items: center; border-right: ' + br + '; border-bottom: ' + bb + '; background: ' + bg + '; box-shadow: ' + ring + '; transition: background 0.15s ease',
          pick: () => this.setState({ sel: key })
        });
      }
    }
    const editable = !G[sr][sc];
    const toggle = (map, n) => { const m = Object.assign({}, map); const a = (m[sel] || []).slice(); const i = a.indexOf(n); if (i >= 0) a.splice(i, 1); else a.push(n); if (a.length) m[sel] = a; else delete m[sel]; return m; };
    const press = (n) => {
      if (!editable) return;
      if (mode === 'normal') this.setState({ entries: Object.assign({}, entries, { [sel]: n }) });
      else if (mode === 'corner') this.setState({ corner: toggle(corner, n), entries: Object.assign({}, entries, { [sel]: 0 }) });
      else this.setState({ center: toggle(center, n), entries: Object.assign({}, entries, { [sel]: 0 }) });
    };
    const pad = [1, 2, 3, 4, 5, 6].map((d) => ({
      d, label: 'Enter ' + d, press: () => press(d),
      style: 'min-height: 52px; border-radius: 12px; padding: 0; font: ' + (mode === 'normal' ? '500 24px' : '600 16px') + ' Inter, sans-serif; color: ' + (mode === 'normal' ? '#2A211B' : '#2F5FB8') + '; background: rgba(255,255,255,0.36); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); border: 1px solid rgba(255,255,255,0.85); box-shadow: 0 4px 12px rgba(30,30,30,0.06), inset 0 1px 0 rgba(255,255,255,0.9)'
    }));
    const seg = (on) => 'min-height: 48px; border-radius: 10px; border: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font: ' + (on ? '700' : '600') + ' 11px Inter, sans-serif; color: ' + (on ? '#2A211B' : '#4E433A') + '; background: ' + (on ? 'rgba(255,255,255,0.85)' : 'transparent') + '; box-shadow: ' + (on ? '0 2px 8px rgba(30,30,30,0.08), inset 0 1px 0 rgba(255,255,255,1)' : 'none');
    const texts = {
      1: ['Look at the highlighted box.', 'It already has five of its six numbers. Which one is missing?'],
      2: ['Only one cell is left in this box.', 'The box has 2, 3, 4, 5 and 6, so this cell must hold the missing number.'],
      3: ['It’s a 1!', 'When a box, row or column has a single empty cell, the missing number goes there.']
    };
    const h = hint || 1;
    const dot = (on) => 'width: 18px; height: 6px; border-radius: 3px; background: ' + (on ? '#C24E2A' : '#E6D8C9');
    const glass = 'width: 44px; height: 44px; border-radius: 12px; padding: 0; display: grid; place-items: center; -webkit-backdrop-filter: blur(18px) saturate(160%); backdrop-filter: blur(18px) saturate(160%); box-shadow: 0 6px 18px rgba(30,30,30,0.07), inset 0 1px 0 rgba(255,255,255,0.9); ';
    return {
      cells, pad,
      sNormal: seg(mode === 'normal'), sCorner: seg(mode === 'corner'), sCenter: seg(mode === 'center'),
      pNormal: String(mode === 'normal'), pCorner: String(mode === 'corner'), pCenter: String(mode === 'center'),
      setNormal: () => this.setState({ mode: 'normal' }),
      setCorner: () => this.setState({ mode: 'corner' }),
      setCenter: () => this.setState({ mode: 'center' }),
      erase: () => { if (!editable) return; const e = Object.assign({}, entries); delete e[sel]; const c1 = Object.assign({}, corner); delete c1[sel]; const c2 = Object.assign({}, center); delete c2[sel]; this.setState({ entries: e, corner: c1, center: c2 }); },
      restart: () => this.setState({ entries: {}, corner: {}, center: {}, hint: 0 }),
      hintOpen: hint > 0, hintOn: String(hint > 0),
      hintBtn: glass + (hint > 0 ? 'background: rgba(255,255,255,0.85); border: 1.5px solid #2A211B' : 'background: rgba(255,255,255,0.3); border: 1px solid rgba(255,255,255,0.75)'),
      openHint: () => this.setState({ hint: hint ? 0 : 1 }),
      closeHint: () => this.setState({ hint: 0 }),
      stepName: ['Nudge', 'Explain', 'Show me'][h - 1],
      hintTitle: texts[h][0], hintBody: texts[h][1],
      dot1: dot(h >= 1), dot2: dot(h >= 2), dot3: dot(h >= 3),
      advanceLabel: h === 1 ? 'Explain' : h === 2 ? 'Show me' : 'Done',
      advance: () => this.setState({ hint: h === 3 ? 0 : h + 1 }),
      showRules: !!st.rules,
      openRules: () => this.setState({ rules: true }),
      closeRules: () => this.setState({ rules: false })
    };
  }
}
</script>
</body>
</html>
